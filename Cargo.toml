[workspace]
resolver = "2"
members = [
    "crates/sourceveil-core",
    "crates/sourceveil-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anYuJia/sourceveil"

[workspace.dependencies]
sourceveil-core = { path = "crates/sourceveil-core" }

# --- error handling / logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- cli ---
clap = { version = "4", features = ["derive"] }

# --- attribute semantics ---
# Only used to *understand* an attribute: `syn` never supplies a source span
# here, because every edit is expressed against ra_ap_syntax offsets.
syn = { version = "2", features = ["parsing", "extra-traits"] }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- project analysis ---
cargo_metadata = "0.23"
walkdir = "2"
globset = "0.4"

# --- hashing / entropy ---
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"

# --- frontend analysis ---
oxc_allocator = "0.150"
oxc_ast = "0.150"
oxc_ast_visit = "0.150"
oxc_parser = "0.150"
oxc_span = "0.150"
oxc_syntax = "0.150"

# --- rust semantic analysis (rust-analyzer as a library) ---
ra_ap_ide = "0.0.352"
ra_ap_ide_db = "0.0.352"
ra_ap_load-cargo = "0.0.352"
ra_ap_proc_macro_api = "0.0.352"
ra_ap_project_model = "0.0.352"
ra_ap_syntax = "0.0.352"
ra_ap_vfs = "0.0.352"

[profile.release]
lto = "thin"
codegen-units = 1
