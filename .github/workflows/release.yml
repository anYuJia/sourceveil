name: Release cargo-obfuscator

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: cargo-obfuscator
            archive: cargo-obfuscator-linux-x86_64.tar.gz
          - os: macos-latest
            platform: macos
            binary: cargo-obfuscator
            archive: cargo-obfuscator-macos.tar.gz
          - os: windows-latest
            platform: windows-x86_64
            binary: cargo-obfuscator.exe
            archive: cargo-obfuscator-windows-x86_64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin cargo-obfuscator

      - name: Strip Linux binary
        if: runner.os == 'Linux'
        run: strip target/release/cargo-obfuscator

      - name: Strip macOS binary
        if: runner.os == 'macOS'
        run: strip target/release/cargo-obfuscator

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp "target/release/${{ matrix.binary }}" package/cargo-obfuscator
          cp README.md package/README.md
          tar -C package -czf "${{ matrix.archive }}" cargo-obfuscator README.md

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" package/cargo-obfuscator.exe
          Copy-Item README.md package/README.md
          Compress-Archive -Path package/cargo-obfuscator.exe,package/README.md -DestinationPath "${{ matrix.archive }}"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: cargo-obfuscator-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cargo-obfuscator-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "${GITHUB_REF_NAME}"
