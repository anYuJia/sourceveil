name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A superseded push should not keep burning minutes. Actions on a private
# repository are billed, so cancelling stale runs is not just tidiness.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool is a build tool, and every one of these is a machine someone
        # will run it on. Windows and macOS matter here specifically because the
        # copier and the verifier both touch paths and the filesystem.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Even with Tauri's mock runtime, tauri-runtime links its Linux GTK and
      # WebKit types. The generated Tauri fixtures are cargo-checked during the
      # e2e suite, so the Ubuntu runner needs the corresponding pkg-config
      # metadata available.
      - name: Install Linux fixture dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev

      # rust-toolchain.toml pins the version: rust-analyzer's published crates
      # track the rustc release cycle, and the pinned one is what this code is
      # written against. Installing it explicitly means a failure here is
      # reported as a toolchain problem rather than as a mysterious build error.
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Show versions
        run: |
          rustc --version
          cargo --version

      # Keyed on the toolchain and Cargo.lock. Must come after the toolchain is
      # installed, or it caches under the wrong key.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests and end-to-end tests. The end-to-end tests transform
      # `tests/fixtures/simple-rust` with the real binary and finish with a
      # real `cargo check` of the result, which is the only thing that can
      # establish the transform works.
      - name: Test
        run: cargo test --all

  package:
    name: package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2

      - name: Build obfuscator
        run: cargo build --release --locked --bin cargo-obfuscator

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-obfuscator-linux-x64
          path: target/release/cargo-obfuscator
          if-no-files-found: error
