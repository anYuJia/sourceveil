[package]
name = "sourceveil-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Semantic-aware source-to-source obfuscator for Rust/Tauri workspaces"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
syn.workspace = true
serde_json.workspace = true
toml.workspace = true
cargo_metadata.workspace = true
walkdir.workspace = true
globset.workspace = true
sha2.workspace = true
hmac.workspace = true
getrandom.workspace = true

oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true

ra_ap_ide.workspace = true
ra_ap_ide_db.workspace = true
ra_ap_load-cargo.workspace = true
ra_ap_proc_macro_api.workspace = true
ra_ap_project_model.workspace = true
ra_ap_syntax.workspace = true
ra_ap_vfs.workspace = true

# Constrains a transitive dependency, not used directly.
#
# `ra-ap-rustc_lexer` 0.166 has a compile-time assertion that
# `unicode_properties::UNICODE_VERSION` and `unicode_ident::UNICODE_VERSION`
# agree. `unicode-properties` has no release past 0.1.4, and 0.1.4 ships
# Unicode 17.0.0, while `unicode-ident` moved to Unicode 18.0.0 in 1.0.23.
# Holding `unicode-ident` at 1.0.22 is what keeps the assertion satisfied.
unicode-ident = "=1.0.22"

[dev-dependencies]
tempfile = "3"

[features]
default = []
