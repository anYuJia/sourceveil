# sourceveil configuration.
#
# Every value below is shown at its built-in default, so deleting this file
# entirely changes nothing. It exists to be edited.
#
# Precedence, highest first:
#   1. an explicit value in this file
#   2. the selected `profile`
#   3. the built-in default

version = 1

# `safe`       symbol rename, build diversification, release string behaviour.
#              Near-zero runtime cost, maximum build compatibility.
# `balanced`   adds private field rename, including serde-safe members where the wire contract can be proven, and internal-string protection.
# `aggressive` reserved for V3 transforms; currently resolves to `balanced`.
profile = "safe"

[project]
# Auto-detected when omitted: `src-tauri/Cargo.toml`, then `Cargo.toml` at the
# root, then a lone crate directory.
# rust_root = "src-tauri"
# frontend_root = "frontend"
# frontend_source = "frontend/src"

# Extra copier exclusions, on top of the built-in set (.git, target,
# node_modules, dist, ...). Gitignore-style globs against workspace-relative
# paths.
ignore = []

[rename]
functions = true
types = true
traits = true
enums = true
consts = true
statics = true
modules = true

# Physical module-file and directory moves are opt-in. They are staged in the
# same transaction as module declaration edits and verified in the generated
# tree.
module_files = false

# `macro_rules!` bodies are a token-level protocol. Renaming works when the
# macro is crate-local, but the failure mode is a broken build in a dependent
# crate, so it stays opt-in.
macros = false

# Fields are off under `safe`. `balanced` turns them on. Serde model
# members are handled by a dedicated pass that preserves their original
# serialize/deserialize names with explicit attributes; unsupported serde
# representations remain pinned.
fields = false

# Rust local bindings and parameters remain off here; frontend lexical bindings
# are controlled independently by [frontend].
locals = false
params = false

# Generated names are 5-9 characters of `[A-Za-z0-9]`, in the casing Rust
# expects for the item kind, so a rename never introduces lint warnings that a
# `-D warnings` build would turn into errors.
name_len_min = 5
name_len_max = 9

[strings]
# Runtime Rust string protection. `balanced` enables the pass and internal
# machine-like literals by default. Compile-time, macro, pattern and ABI
# contexts remain untouched.
enabled = false
logs = false
errors = false
internal = false
ui = false
endpoints = false

[tauri]
# Rename `#[tauri::command]` handlers together with every frontend
# `invoke("...")` that calls them, the `generate_handler!` entry, and any Rust
# allow-list or dispatch arm that names them — as one transaction.
#
# Any doubt keeps the command and reports why. In particular a single dynamic
# `invoke(expr)` keeps the whole namespace, because a runtime-computed name
# could refer to any command.
commands = true

# Rename Tauri event channels on both sides — Rust `emit`/`listen` and the
# frontend `emit`/`listen`/`once`.
#
# An event has no registry the way `generate_handler!` is one, so a rename only
# happens when the graph is closed: at least one producer and at least one
# consumer, both inside the generated workspace. An event that is only listened
# for may be produced by a plugin; one that is only emitted may be consumed by a
# page this tool cannot see. Either way it stays.
events = true

# Extra callee names to treat as `invoke`. `invoke` and `tauriInvoke` are always
# recognised, as are local functions that forward their first parameter to one
# of them.
invoke_names = []

# Window labels are a framework-level identifier. Kept regardless.
window_labels = false

scan_command_literals = true

[frontend]
# OXC semantic binding rename. Only private lexical identifiers are eligible;
# member properties, object/JSON keys, imports and exports remain unchanged.
enabled = false
rename_private_identifiers = false

# Off by design, not merely unimplemented. Property names cross the JSON /
# React-prop / store boundary, and cannot be proven safe from the frontend
# alone.
property_mangling = false

[dependencies]
# `external` (leave alone), `private-obfuscate`, `obfuscate`, or `wrapper`.
default = "external"

# Per-crate overrides. A dependency not listed here uses default; package
# names may use Cargo's hyphenated spelling or the underscore alias used in
# Rust source.
#
# reqwest = { mode = "wrapper" }
# my_core_lib = "private-obfuscate"

[build]
# `auto`    — `hmac` when OBFUSCATION_SEED_KEY is set, otherwise `random`
# `hmac`    — HMAC-SHA256(OBFUSCATION_SEED_KEY, "<git-sha>:<release-tag>")
# `random`  — OS entropy
# a decimal u64 — used verbatim
seed = "auto"

verify = true

# Run in this order; the pipeline stops at the first failure.
# `npm-ci` has to come before the scripts that need `node_modules`, because the
# copier deliberately does not copy `node_modules` into the generated tree.
verify_stages = [
    "cargo-metadata",
    "cargo-check",
    "npm-ci",
    "npm-typecheck",
    "npm-build",
    "leak-scan",
]

write_mapping = true

# Relative to the output root. `mapping.json` is the answer key: anyone holding
# it can read a shipped stack trace. Do not put it anywhere that gets packaged,
# and do not upload it to a public release.
mapping_dir = ".obfuscator"

# `input`  — analyse the project as it stands (faster; build-script outputs in
#            the existing `target/` are reused)
# `output` — analyse the generated copy
analyze = "input"

# Run `cargo check` while loading so build-script `OUT_DIR` artifacts resolve.
# Correct, and it compiles the workspace once.
load_out_dirs = true

# Abort instead of skipping when a symbol cannot be safely renamed.
strict = false

[keep]
# `main` and the linkage attributes are always kept, whether or not they appear
# here. This list is for anything project-specific.
symbols = []

# Globs matched against the item name, e.g. "ffi_*".
patterns = []

# Workspace-relative file globs excluded from transformation entirely.
files = []

# Attribute paths that force an item to be kept, e.g. "tokio::main".
attributes = []
